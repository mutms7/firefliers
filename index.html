<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Firefliers</title>
<meta name="description" content="Keep the light alive until dawn. A tiny survivors game you can pick up in ten seconds, with a daily challenge to beat your friends at.">
<meta property="og:title" content="Firefliers">
<meta property="og:description" content="Keep the light alive until dawn. Everyone gets the same daily run, so come beat my score.">
<meta name="theme-color" content="#0a0c0d">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:image" content="https://firefliers.vercel.app/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0c0d;--panel:#0e1213;--ink:#e9e4d6;--dim:#8d9491;--mute:#5d6563;--line:#283030;--line2:#465150;--hi:#d8d2c2;
    --gold:#f2c14e;--mint:#7fd6c2;--red:#e8604c;--px:"Jersey 20",ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--px);font-variant-ligatures:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;
    padding:24px 16px;text-align:center;z-index:5;background:radial-gradient(ellipse at 50% 42%,rgba(9,12,13,.62) 0%,rgba(6,8,9,.88) 62%,rgba(3,4,5,.97) 100%)}
  #start{background:radial-gradient(ellipse at 50% 46%,rgba(8,11,12,.08) 0%,rgba(6,8,9,.55) 62%,rgba(3,4,5,.92) 100%)}
  .flies{position:absolute!important;inset:0;overflow:hidden;pointer-events:none}
  .flies i{position:absolute;width:5px;height:5px;background:#ffe9a0;box-shadow:0 0 12px 4px #f2c14e77;opacity:0;animation:drift var(--d) ease-in-out var(--dl) infinite}
  @keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(var(--dx),var(--dy));opacity:.3}
    72%{opacity:.9}100%{transform:translate(calc(var(--dx)*1.8),calc(var(--dy)*-.6));opacity:0}}
  @media (prefers-reduced-motion:reduce){.flies i{animation:none;opacity:.5}}
  .modebox{--k:var(--line2);position:relative;width:min(560px,100%);padding:14px 14px 10px;margin-top:2px;border:1px solid var(--line);background:rgba(8,11,12,.72)}
  .cont{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px 0 10px}.cont .btn{min-width:min(320px,100%)}.cont .best{margin:0}
  .modebox-h{position:absolute;left:50%;top:-11px;transform:translateX(-50%);padding:0 10px;background:#0b0e0f;font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .modeNote{font-size:16px;color:var(--dim);min-height:0}.modeNote:empty{display:none}
  .btn:disabled{filter:grayscale(1) brightness(.5);cursor:not-allowed;transform:none}
  .btn.nightmare{color:#fff0e8;background:linear-gradient(180deg,#e66a55,#b23a2c);box-shadow:inset 0 2px 0 #ffb8a4,inset 0 -4px 0 #7a1a14,0 4px 0 #000c}
  .havenBtn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;width:min(560px,100%);margin-top:14px;padding:12px 18px;text-align:left;
    background:linear-gradient(90deg,rgba(242,193,78,.1),rgba(13,17,18,.9));border:1px solid #7c6630;border-left:3px solid var(--gold);box-shadow:0 4px 0 #000b;transition:transform .1s,border-color .1s}
  .havenBtn:hover:not(:disabled),.havenBtn:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-2px)}
  .havenBtn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
  .hv-t{font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.hv-a{grid-row:span 2}.hv-n{font-size:17px;color:var(--dim)}
  .havenBtn.calling{animation:calling 1.8s ease-in-out infinite}.havenBtn.calling .hv-n{color:var(--ink)}
  @keyframes calling{50%{box-shadow:0 4px 0 #000b,0 0 26px -4px var(--gold)}}
  @media (prefers-reduced-motion:reduce){.havenBtn.calling{animation:none;box-shadow:0 4px 0 #000b,0 0 20px -6px var(--gold)}}
  .who{font-size:16px;color:var(--dim);margin-top:2px}.who:empty{display:none}
  /* the Haven: a walkable place you visit from the menu */
  #haven{position:fixed;inset:0;z-index:5;background:#06090a;overflow:hidden;outline:none;touch-action:none}
  #haven>canvas{position:absolute;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
  #hubHud,#hubHint{transition:opacity .8s}
  #haven.resting #hubHud,#haven.resting #hubHint,#haven.resting #hubTitle{opacity:0!important;transition:opacity 2.5s;pointer-events:none}
  .hud-r{display:flex;gap:8px;align-items:center}#haven.intro .hud-r>.btn{display:none}.hud-r .btn{padding:8px 14px!important}
  #hubTitle b{color:var(--gold)}
  /* dialogue */
  #dlg{position:absolute;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;
    padding:14px 16px 16px;background:linear-gradient(180deg,rgba(20,26,27,.97),rgba(10,13,14,.98));border:1px solid var(--line2);border-top:2px solid var(--gold);box-shadow:0 18px 50px -12px #000;cursor:pointer}
  .dlg-pt{width:92px;height:92px;display:grid;place-items:center;background:radial-gradient(circle,#1c2224,#070909);border:1px solid var(--line2)}
  .dlg-pt canvas{position:static;width:auto;height:auto;max-width:84px;max-height:84px;image-rendering:pixelated}
  .dlg-body{min-width:0;position:relative}
  #dlgName{display:block;font-weight:400;font-size:22px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
  #dlgText{margin:4px 0 0;max-width:none;color:var(--ink);font-size:21px;line-height:1.35;min-height:2.7em}
  .dlg-next{position:absolute;right:0;bottom:-4px;width:0;height:0;border:7px solid transparent;border-top-color:var(--gold);animation:nextBob 1s ease-in-out infinite}
  #dlg.choosing .dlg-next{display:none}
  @keyframes nextBob{50%{transform:translateY(3px)}}
  @media (prefers-reduced-motion:reduce){.dlg-next{animation:none}}
  #dlgOpts{display:flex;flex-direction:column;gap:6px;margin-top:10px}#dlgOpts:empty{display:none}
  #dlgOpts.pending{visibility:hidden}#dlgText .unsaid{visibility:hidden}
  .opt-btn{display:flex;gap:10px;align-items:center;text-align:left;font-size:20px;padding:7px 10px;background:#0c1011;border:1px solid var(--line);border-left:3px solid var(--line2);color:var(--ink)}
  .opt-btn:hover,.opt-btn:focus-visible{border-color:var(--gold);border-left-color:var(--gold);background:#1a1a12;outline:none}
  .opt-btn .k{font-size:15px;color:var(--mute);border:1px solid var(--line2);min-width:22px;height:22px;display:grid;place-items:center}
  .ask{display:flex;gap:8px;flex-wrap:wrap}.ask input,.ask textarea{flex:1;min-width:180px;font:inherit;font-size:20px;color:var(--ink);background:#06090a;border:1px solid var(--line2);padding:8px 10px;outline:none}
  .ask input:focus,.ask textarea:focus{border-color:var(--gold)}.ask.fb{flex-direction:column}.ask textarea{resize:vertical;min-height:84px}
  .fb-row{display:flex;gap:8px;justify-content:flex-end}.fb-note{margin:0;max-width:none;font-size:16px;color:var(--dim)}
  @media (max-width:640px){#dlg{grid-template-columns:1fr;gap:6px}.dlg-pt{display:none}#dlgText{font-size:19px}.hud-r .btn{padding:6px 10px!important;font-size:15px!important}}
  /* the Gate: every way to play, side by side */
  .hp-sub{margin:0 auto 8px;font-size:19px}
  .modes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mode{--c:var(--gold);display:grid;gap:4px;text-align:left;padding:12px 14px;background:#0c1011;border:1px solid var(--line);border-left:3px solid var(--c);transition:transform .1s,background .1s}
  .mode.mint{--c:var(--mint)}.mode.red{--c:#e8604c}.mode.stone{--c:var(--hi)}
  .mode b{font-weight:400;font-size:24px;color:var(--c)}.mode span{font-size:17px;color:var(--dim);line-height:1.3}
  .mode:hover:not(:disabled),.mode:focus-visible{background:color-mix(in srgb,var(--c) 14%,#0c1011);outline:none;transform:translateY(-2px)}
  .mode:disabled{opacity:.5;cursor:not-allowed}
  @media (max-width:640px){.modes-grid{grid-template-columns:1fr}}
  .tree-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .tc-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #hubHud{position:absolute;z-index:2;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #hubHud>*{pointer-events:auto}
  #hubAmber{background:rgba(6,9,10,.8);border:1px solid var(--line2);padding:4px 12px 4px 8px;text-shadow:0 2px 0 #000}
  #hubGear{display:grid;place-items:center;width:42px;height:42px;background:rgba(6,9,10,.8);border:1px solid var(--line2)}
  #hubGear:hover,#hubGear:focus-visible{border-color:var(--hi);outline:none}
  #hubTitle{position:absolute;z-index:1;left:50%;top:14px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000}
  #hubTitle b{font-weight:400;font-size:clamp(34px,6vw,52px);letter-spacing:.06em;color:var(--gold)}#hubTitle span{font-size:18px;color:var(--ink)}
  #hubTitle.show{animation:hubTitle 7s ease forwards}
  @keyframes hubTitle{0%,70%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#hubTitle.show{animation:none;opacity:1}}
  @media (max-width:640px){#hubTitle{top:66px}}
  #hubHint{position:absolute;z-index:2;left:50%;bottom:22px;transform:translateX(-50%)}
  .hint-btn{font-size:20px;color:var(--ink);display:inline-flex;gap:10px;align-items:center;background:rgba(6,9,10,.8);border:1px solid var(--line2);padding:5px 14px 5px 6px;text-shadow:0 2px 0 #000;white-space:nowrap}
  .hint-btn:hover,.hint-btn:focus-visible{border-color:var(--gold);outline:none}
  /* a plain key cap: light face, dark edge, a hard bottom lip, and the letter at full size */
  .keycap{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 7px 3px;font-size:22px;line-height:1;color:#141818;text-shadow:none;background:#e9e4d6;border:2px solid #030405;box-shadow:inset 0 -4px 0 #8d9491,inset 0 2px 0 #ffffff}
  #hubOv{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:16px;background:rgba(4,6,7,.62);overflow-y:auto}
  .hubPanel{--k:var(--gold);display:flex;flex-direction:column;gap:6px;text-align:center}
  .hubPanel.big{width:min(900px,100%)}
  .hp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
  .hp-head h2{margin:0;padding:0;border:0;color:var(--gold);font-size:clamp(28px,5vw,40px)}
  .hp-head .btn{padding:6px 8px!important;display:grid;place-items:center}
  .price{display:inline-flex;gap:6px;align-items:center;font-size:22px;color:var(--gold)}
  .gate{display:flex;gap:16px;align-items:center;justify-content:center;text-align:left}
  .gate .pt{width:96px;height:96px;border:1px solid var(--line2);background:#070909}
  .gate b{display:block;font-size:26px;font-weight:400}.gate span{display:block;font-size:19px;color:var(--dim)}
  .chars.roost{grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin:6px 0 0}
  .stats.rec{grid-template-columns:repeat(4,minmax(0,1fr))}
  .amberGot{display:flex;gap:10px;align-items:center;justify-content:center;font-size:24px;color:var(--gold);min-height:0;margin-top:10px}
  .amberGot:empty{display:none}
  /* the Root Tree */
  .tree{position:relative;height:min(460px,58vh);min-height:300px;border:1px solid var(--line);background:#06090a;overflow:hidden;cursor:grab;touch-action:none;outline:none}
  .tree:focus-within{border-color:var(--line2)}
  .tree canvas{position:absolute;inset:0;width:100%;height:100%}
  .tree-bal{display:none}
  .panel.tree-card{--k:var(--line2);position:absolute;right:10px;bottom:10px;width:min(320px,calc(100% - 20px));padding:12px;display:grid;gap:10px;text-align:left}
  .tc{display:flex;gap:12px;align-items:center}.tc b{display:block;font-size:22px;font-weight:400}.tc span{font-size:18px;color:var(--dim)}
  .tc-own{color:var(--mint);font-size:19px}.tc-need{color:var(--dim);font-size:18px}.tc-hint{margin:0;color:var(--dim);font-size:18px}
  .tree-card .btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;font-size:22px;padding:8px 18px}
  .tree-card .btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
  .sr-nodes{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tree-help{font-size:17px;color:var(--mute);margin:2px 0 0}
  /* settings */
  .panel.set{width:min(460px,100%);display:grid;gap:16px}
  #setBody{display:grid;gap:16px}
  .field{display:grid;grid-template-columns:84px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:20px;text-align:left}
  .field output{color:var(--dim);text-align:right}
  .opt{display:inline-flex;gap:12px;align-items:center;font-size:20px;cursor:pointer;justify-self:start}
  .screen::before,.screen::after{content:"";flex:1 0 0}
  .screen>*{position:relative;flex:none}
  .hidden{display:none!important}
  .screen{scrollbar-width:thin;scrollbar-color:#465150 transparent}

  /* panels: flat dark slabs with bright corner brackets */
  .panel{--k:var(--hi);width:min(640px,100%);padding:22px 22px 20px;border:1px solid var(--line);
    background:
      linear-gradient(var(--k),var(--k)) 0 0/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 0 0/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 100% 0/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 100% 0/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 0 100%/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 0 100%/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 100% 100%/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 100% 100%/2px 18px no-repeat,
      linear-gradient(180deg,rgba(20,26,27,.95),rgba(10,13,14,.97));
    box-shadow:0 0 0 1px #000a,0 24px 60px -16px #000}
  .panel.wide{width:min(920px,100%)}
  .panel h2{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}

  h1{font-size:clamp(62px,12.5vw,148px);margin:0;letter-spacing:.05em;font-weight:400;line-height:1;
    background:linear-gradient(180deg,#fff6d6 0%,#f6d27a 45%,#e2a13a 75%,#b86e22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 5px 0 #140c03) drop-shadow(0 0 26px rgba(242,193,78,.3))}
  .tag{display:flex;align-items:center;gap:12px;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(14px,2.6vw,18px);color:var(--dim);margin:14px 0 2px}
  .tag::before,.tag::after{content:"";width:clamp(20px,8vw,64px);height:1px;background:var(--line2)}
  h2{font-size:clamp(32px,6vw,48px);margin:0 0 6px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 0 #000}
  #luTitle{color:var(--gold)}
  p{color:var(--dim);max-width:540px;line-height:1.45;margin:10px auto;font-size:19px}
  .sub{margin:0 0 12px;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .btn{font-weight:400;font-size:25px;letter-spacing:.08em;text-transform:uppercase;padding:12px 34px;border-radius:2px;color:#1d1404;
    background:linear-gradient(180deg,#ffdc82,#e8a936);border:2px solid #1d1404;
    box-shadow:inset 0 2px 0 #fff3c8,inset 0 -4px 0 #b4741c,0 4px 0 #000c;transition:transform .08s,filter .12s}
  .btn:hover,.btn:focus-visible{filter:brightness(1.1);outline:2px solid var(--ink);outline-offset:3px}
  .btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff3c8,inset 0 -4px 0 #b4741c,0 1px 0 #000c}
  .btn.daily{color:#05201a;background:linear-gradient(180deg,#b2efe1,#5cbaa4);box-shadow:inset 0 2px 0 #eafffa,inset 0 -4px 0 #34806f,0 4px 0 #000c}
  .btn.daily:active{box-shadow:inset 0 2px 0 #eafffa,inset 0 -4px 0 #34806f,0 1px 0 #000c}
  .btn.ghost{color:var(--ink);background:rgba(13,17,18,.88);border:1px solid var(--line2);box-shadow:0 3px 0 #000b;font-weight:400}
  .btn.ghost:hover,.btn.ghost:focus-visible{border-color:var(--hi);background:#1a2122;filter:none}
  .btn.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 #000b}
  .small{font-size:16px!important;padding:8px 14px!important}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}

  /* level up: a stack of item rows */
  .cards{display:flex;flex-direction:column;gap:8px;width:100%}
  .card{--c:var(--hi);position:relative;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;padding:10px 12px 10px 10px;
    background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-left:3px solid var(--c);border-radius:2px;
    transition:background .1s,border-color .1s,transform .1s}
  .card:hover,.card:focus-visible{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.02));border-color:var(--c);outline:none;transform:translateX(4px)}
  .card .ic{width:60px;height:60px;display:grid;place-items:center;font-size:38px;line-height:1;color:var(--c);background:#070909;
    border:2px solid color-mix(in srgb,var(--c) 55%,#000);box-shadow:inset 0 0 20px -6px var(--c);text-shadow:0 0 12px var(--c)}
  .card .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .card .nm{font-size:24px;font-weight:400;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .card .lv{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:400}
  .card .new{font-size:14px;letter-spacing:.1em;color:#1d1404;background:var(--gold);padding:2px 6px 1px;font-weight:400}
  .card .ds{color:var(--dim);font-size:18px;line-height:1.35}
  .card .ev{font-size:15px;color:#c3a462}.card .ev.have{color:var(--mint)}
  .card .ic img,.chip i img,.dmgRow i img,#topbtns img,.pxi{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .dmgRow i{display:inline-block;vertical-align:middle}
  .card .k{font-size:16px;color:var(--mute);border:1px solid var(--line2);width:26px;height:26px;display:grid;place-items:center}
  .card.evo{--c:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.18),rgba(242,193,78,.03));border-color:var(--gold);box-shadow:0 0 26px -10px var(--gold)}
  .card.syn{border-color:var(--gold);box-shadow:0 0 24px -8px var(--gold)}

  /* bug select */
  .chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(560px,100%);margin:22px 0 22px}
  .char{--c:var(--hi);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 11px;background:rgba(11,14,15,.88);border:1px solid var(--line);border-radius:2px;
    transition:transform .1s,border-color .1s,background .1s}
  .char .pt{width:72px;height:72px;display:block;margin-bottom:4px;border:1px solid var(--line2);background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 22%,#070909) 0%,#070909 70%)}
  .char b{font-size:20px;font-weight:400}.char span{font-size:15px;color:var(--dim);line-height:1.3}
  .char.sel{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,rgba(11,14,15,.9)),rgba(11,14,15,.92));box-shadow:inset 0 0 0 1px var(--c),0 0 26px -10px var(--c)}
  .char.sel .pt{border-color:var(--c)}
  .char.locked{cursor:default}.char.locked .pt{background:#070909}.char.locked b{color:var(--mute)}.char.locked span{color:var(--dim)}
  .char:not(.locked):hover,.char:not(.locked):focus-visible{transform:translateY(-3px);outline:none;border-color:var(--c)}

  /* numbers */

(() => {

const glowCache = {};

    case 'zap': tone(1500, .09, 'sawtooth', .04, -1100); break;
    case 'boom': noise(.7, .35, 1500); tone(90, .7, 'sine', .35, -50); break;

/* ---------- music ----------

  [[0, 76, 3], [3, 72, 1], [4, 69, 4], [10, 72, 2], [12, 74, 2], [14, 76, 2]],

  [[0, 79, 3], [3, 76, 1], [4, 72, 4], [10, 72, 2], [12, 76, 2], [14, 79, 2]],

  [[0, 84, 3], [3, 81, 1], [4, 77, 4], [10, 77, 2], [12, 81, 2], [14, 84, 2]],

  [[0, 69, 2], [2, 72, 2], [4, 77, 4], [8, 76, 2], [10, 72, 2], [12, 69, 4]],

const FLOWERS = ['#ff9ac8', '#a8c8ff', '#ffe066'].map(c => bake({ f: c, y: '#fff4d8', s: '#2e5a32' }, ['.f.', 'fyf', '.f.', '.s.'], null));

// ---------- tiles (16x16), painted pixel by pixel. Clusters wrap across edges so the grid doesn't show. ----------
const T16 = 16;
function tile(fn, seed) { reseed(seed); return px(T16, T16, (c, dot, box) => fn(c, dot, box)); }
const wrap = v => ((v % 16) + 16) % 16;
// a tuft: a little two- or three-blade "v" of lighter pixels with a dark root
function tuft(dot, x, y, light, dark) { dot(wrap(x), wrap(y), dark); dot(wrap(x - 1), wrap(y - 1), light); dot(wrap(x + 1), wrap(y - 1), light); if (rnd() < .5) dot(wrap(x), wrap(y - 2), light); }
const HUB = { grass: ['#0d1715', '#132320', '#1a2f29', '#244034', '#335440'], dirt: ['#15110f', '#211a15', '#2e241c', '#3e3226', '#544434'], water: ['#071420', '#0b2030', '#11304a', '#1b4866', '#3a7090'] };
function grassTile(seed, flowers, pal = HUB.grass) {
  return tile((c, dot, box) => {
    box(0, 0, 16, 16, pal[2]);
    for (let i = 0; i < 26; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, rnd() < .5 ? pal[1] : pal[3]); // speckle
    for (let i = 0; i < 4; i++) tuft(dot, (rnd() * 16) | 0, (rnd() * 16) | 0, pal[4], pal[1]);
    if (flowers) for (let i = 0; i < 2; i++) { const x = (rnd() * 14 + 1) | 0, y = (rnd() * 14 + 1) | 0, col = ['#ff9ac8', '#a8c8ff', '#ffe066', '#c8b0ff'][(rnd() * 4) | 0]; dot(x, y, col); dot(wrap(x + 1), y, col); dot(x, wrap(y + 1), pal[1]); }
  }, seed);
}
function dirtTile(seed) { return tile((c, dot, box) => { box(0, 0, 16, 16, HUB.dirt[2]); for (let i = 0; i < 30; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, rnd() < .6 ? HUB.dirt[1] : HUB.dirt[3]); for (let i = 0; i < 3; i++) { const x = (rnd() * 15) | 0, y = (rnd() * 15) | 0; dot(x, y, HUB.dirt[4]); dot(x + 1, y, HUB.dirt[3]); dot(x, y + 1, HUB.dirt[0]); dot(x + 1, y + 1, HUB.dirt[1]); } }, seed); }
// stepping slabs set into dirt: lit top-left edge, shadow bottom-right, mortar in between
function slabTile(seed) {
  return tile((c, dot, box) => {
    box(0, 0, 16, 16, HUB.dirt[1]);
    for (const [x0, y0, w, h] of [[1, 1, 7, 6], [9, 1, 6, 7], [1, 8, 6, 7], [8, 9, 7, 6]]) {
      box(x0, y0, w, h, P.stone[2]); box(x0, y0, w, 1, P.stone[3]); box(x0, y0, 1, h, P.stone[3]); box(x0, y0 + h - 1, w, 1, P.stone[1]); box(x0 + w - 1, y0, 1, h, P.stone[1]);
      if (rnd() < .6) dot(x0 + 2 + ((rnd() * (w - 3)) | 0), y0 + 2 + ((rnd() * (h - 3)) | 0), P.stone[1]);
      if (rnd() < .5) dot(x0 + 1, y0 + 1, P.stone[4]);
    }
    for (let i = 0; i < 4; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, '#3a6040');
  }, seed);
}
function waterTile(f) {
  return tile((c, dot, box) => {
    box(0, 0, 16, 16, HUB.water[2]);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (((x + y * 3 + f * 2) % 11) === 0 && y % 4 === 1) { dot(x, y, HUB.water[4]); dot(wrap(x + 1), y, HUB.water[3]); dot(x, wrap(y + 2), HUB.water[1]); }
    for (let i = 0; i < 10; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, HUB.water[1]);
  }, 5);
}
// grass meeting water: a lip of grass, a one-pixel dark shadow, then water
function shoreTile(f) { const w = waterTile(f), gr = grassTile(3); return px(16, 16, (c, dot) => { c.drawImage(w, 0, 0); c.drawImage(gr, 0, 0, 16, 5, 0, 0, 16, 5); for (let x = 0; x < 16; x++) { const lip = 4 + ((x * 5) % 3 === 0 ? 1 : 0); dot(x, lip, HUB.grass[1]); dot(x, lip + 1, HUB.water[0]); if (x % 5 === 2) dot(x, lip + 3, HUB.water[4]); } }); }
// the root walls around the Hollow: a gnarled top face, then a bark face with a shadow under it
function rootTop(seed) { return tile((c, dot, box) => { box(0, 0, 16, 16, P.bark[2]); for (let y = 1; y < 16; y += 4) for (let x = 0; x < 16; x++) if ((x + y + ((rnd() * 3) | 0)) % 5) dot(x, wrap(y + ((x >> 2) % 2)), P.bark[3]); for (let i = 0; i < 12; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, P.bark[1]); for (let i = 0; i < 5; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, '#3a6a3a'); }, seed); }
function rootFace(seed) { return tile((c, dot, box) => { box(0, 0, 16, 16, P.bark[1]); for (let x = 0; x < 16; x += 3) for (let y = 0; y < 16; y++) if (rnd() < .8) dot(wrap(x + ((y >> 2) % 2)), y, P.bark[2]); box(0, 0, 16, 1, P.bark[3]); box(0, 14, 16, 2, P.bark[0]); for (let i = 0; i < 3; i++) { const x = (rnd() * 14) | 0; dot(x, 1, '#4a7a46'); dot(x + 1, 1, '#4a7a46'); dot(x, 2, '#2e5a32'); } }, seed); }
function plankTile(seed) { return tile((c, dot, box) => { for (let y = 0; y < 16; y += 4) { box(0, y, 16, 4, P.wood[2]); box(0, y, 16, 1, P.wood[3]); box(0, y + 3, 16, 1, P.wood[1]); const cut = (y * 5 + 3) % 16; box(cut, y, 1, 4, P.wood[0]); } for (let i = 0; i < 6; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, P.wood[1]); }, seed); }
function mossTile(seed) { return tile((c, dot, box) => { box(0, 0, 16, 16, '#1e3a24'); for (let i = 0; i < 60; i++) dot((rnd() * 16) | 0, (rnd() * 16) | 0, ['#2e5a32', '#173020', '#3a6a3a'][(rnd() * 3) | 0]); }, seed); }

const HUB_TILES = {
  grass: [grassTile(1), grassTile(2), grassTile(3), grassTile(4, true)], dirt: [dirtTile(11), dirtTile(12)], slab: [slabTile(21), slabTile(22)], moss: [mossTile(41)],
  water: [waterTile(0), waterTile(1)], shore: [shoreTile(0), shoreTile(1)], rootTop: [rootTop(51), rootTop(52)], rootFace: [rootFace(61), rootFace(62)], plank: [plankTile(71)],

// the run's meadow: the same ruin as now, but as 16x16 tiles. Darker and colder than the hub, so the creatures pop.
const RUN = { grass: ['#0a1112', '#0f1918', '#152220', '#1d2e29', '#2a4036'] };
function runSlab(seed, cracked) { return tile((c, dot, box) => { box(0, 0, 16, 16, RUN.grass[2]); box(1, 1, 14, 14, '#1c2426'); box(1, 1, 14, 1, '#28322f'); box(1, 1, 1, 14, '#28322f'); box(1, 14, 14, 1, '#111819'); box(14, 1, 1, 14, '#111819'); if (cracked) { let x = 5, y = 1; while (y < 15) { dot(x, y, '#0a0f10'); y++; if (rnd() < .4) x += rnd() < .5 ? -1 : 1; } } for (let i = 0; i < 10; i++) dot(1 + ((rnd() * 14) | 0), 1 + ((rnd() * 14) | 0), rnd() < .5 ? '#2e4a34' : '#161e20'); }, seed); }
function puddle(f) { return tile((c, dot, box) => { box(0, 0, 16, 16, RUN.grass[2]); for (let y = 3; y < 13; y++) for (let x = 2; x < 14; x++) if (((x - 7.5) / 6) ** 2 + ((y - 7.5) / 4.6) ** 2 < 1) dot(x, y, y < 5 ? '#0b1a24' : '#0e2230'); for (let x = 4; x < 12; x++) dot(x, 4, '#05101a'); dot(6 + f, 7, '#3a6a88'); dot(7 + f, 7, '#2a5070'); dot(9 - f, 10, '#2a5070'); }, 81); }
function rebarTile(seed) { return tile((c, dot, box) => { c.drawImage(grassTile(seed, false, RUN.grass), 0, 0); let x = 2, y = 13; for (let i = 0; i < 12; i++) { dot(x, y, '#4a2c1e'); dot(x, y - 1, '#8a5232'); x++; if (i % 3 === 0) y--; } }, seed); }
function sporeTile(seed) { return tile((c, dot) => { c.drawImage(grassTile(seed, false, RUN.grass), 0, 0); for (const [x, y, col] of [[4, 5, '#7fb9b0'], [10, 11, '#a99cc4'], [12, 3, '#c2b48a']]) { dot(x, y, col); dot(x + 1, y + 1, col); dot(x - 1, y + 2, col); } }, seed); }
const RUN_TILES = { grass: [grassTile(91, false, RUN.grass), grassTile(92, false, RUN.grass), grassTile(93, false, RUN.grass), grassTile(94, false, RUN.grass)], slab: [runSlab(101), runSlab(102, true)], puddle: [puddle(0), puddle(1)], rebar: [rebarTile(111)], spores: [sporeTile(121)] };
// run props, top-down-ish: a broken pillar stump, a ring of standing stones, a dead lamp post, a mushroom cluster, a root arch
const STUMP = bake({ S: P.stone, d: '#16181e', m: '#3a6a3a' }, (() => { const g = pg(18, 14); ell(g, 9, 9, 8.5, 5, 'S'); ell(g, 9, 6, 8.5, 5, 'S'); ell(g, 9, 6, 6, 3.4, 'd'); for (let x = 3; x < 15; x += 3) put(g, x, 4 - (x % 2), 'S'); put(g, 4, 9, 'm'); put(g, 13, 10, 'm'); return g; })());
const STANDING = bake({ S: P.mossStone, m: '#4a7a46' }, (() => { const g = pg(10, 18); polyFill(g, [[2, 17], [1, 5], [4, 0], [8, 3], [9, 17]], 'S'); put(g, 3, 6, 'm'); put(g, 4, 7, 'm'); return g; })());
const DEAD_LAMP = bake({ t: '#2a2420', L: ['#1a1a1a', '#2a2a2a', '#3a3a3a', '#4a4a4a', '#5a5a5a'], g: '#2a3a4a' }, (() => { const g = pg(9, 24); rect(g, 4, 6, 4, 23, 't'); rect(g, 1, 1, 7, 1, 'L'); rect(g, 2, 2, 6, 5, 'L'); rect(g, 3, 2, 5, 4, 'g'); put(g, 6, 7, 't'); put(g, 7, 8, 't'); return g; })());

// ---------- icons (16x16 unless noted). Each is a little object you could pick up, not a font glyph. ----------
const I = (w, h, fn, pal, ol) => { const g = pg(w, h); fn(g); return bake(pal, g, ol === undefined ? '#050608' : ol); };
const heartMask = (g, cx, cy, s, ch) => { for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) { const X = (x + .5 - cx) / s, Y = -(y + .5 - cy) / s; if ((X * X + Y * Y - 1) ** 3 - X * X * Y ** 3 <= 0) g[y][x] = ch; } };
const starPts = (cx, cy, R, r, n = 5, rot = -Math.PI / 2) => Array.from({ length: n * 2 }, (_, i) => { const a = rot + i * Math.PI / n, d = i % 2 ? r : R; return [cx + Math.cos(a) * d, cy + Math.sin(a) * d]; });
const bolt = (g, ch) => polyFill(g, [[9, 0], [3, 9], [7, 9], [5, 16], [13, 6], [9, 6], [11, 0]], ch);

    box(0, 0, w, h, o.outline); box(1, 1, w - 2, h - 2, o.fill);
    if (o.hi) { box(1, 1, w - 2, 1, o.hi); box(1, 1, 1, h - 2, o.hi); } if (o.lo) { box(1, h - 2, w - 2, 1, o.lo); box(w - 2, 1, 1, h - 2, o.lo); }
    if (o.bevel) box(1, h - 1 - o.bevel, w - 2, o.bevel, o.lo);
    if (o.corner) for (const [x, y, sx, sy] of [[1, 1, 1, 1], [w - 2, 1, -1, 1], [1, h - 2, 1, -1], [w - 2, h - 2, -1, -1]]) { dot(x, y, o.corner); dot(x + sx, y, o.corner); dot(x + 2 * sx, y, o.corner); dot(x, y + sy, o.corner); dot(x, y + 2 * sy, o.corner); }

}

/* ---------- the main menu, and the Haven behind it ---------- */
// The game always opens on the main menu: the logo, your bug and every way to play in one box. The Haven is a walkable
// place you visit from there, where the Root Tree, the Roost, the records and the residents live.
let hollow = null, hubOpen = null, where = 'menu'; // the walkable Haven, which station's panel is open, and which screen is up
const amberTag = n => '<span class="price">' + iconImg(ART.AMBER_SMALL, 3) + num(n) + '</span>';

const revealed = new Set(); // during Glim's tour, the stations he has shown you so far
const stationOpen = p => save.met || p.station === 'locked' || p.npc === 'glim' || revealed.has(p.station) || revealed.has(p.npc);

// ---- main menu ----
function buildStart() {
  const box = $('chars'); box.innerHTML = '';
  for (const id in CHARS) {
    const c = CHARS[id], un = hasBug(id), b = document.createElement('button');
    b.className = 'char' + (un ? '' : ' locked') + (save.char === id ? ' sel' : ''); b.style.setProperty('--c', c.col);
    b.innerHTML = '<img class="pt" alt="" src="' + portrait(id, !un) + '"><b>' + (un ? c.name : 'Locked') + '</b><span>' + (un ? c.role : 'Grow it on the Root Tree in the Haven') + '</span>';
    if (un) { b.setAttribute('aria-pressed', save.char === id); b.onclick = () => { save.char = id; persist(); buildStart(); sfx('select'); }; } else b.setAttribute('aria-disabled', 'true');
    box.appendChild(b);
  }

  $('dailyBtn').innerHTML = 'Daily #' + (td - DAY0 + 1);
  $('dailyInfo').textContent = first ? '' : "Today's bug is the " + CHARS[dailyCharId(td)].name + (mine ? ', and your best so far is ' + num(sd.best) + (sd.streak > 1 ? ' (' + sd.streak + ' day streak)' : '') : ', with the same cards and waves for everyone');
  $('nmBtn').innerHTML = 'Nightmare' + (save.nmWon ? ' ★' : '');
  const lock = (id, on, why) => { const b = $(id); b.disabled = !on; b.title = on ? '' : why; };
  lock('dailyBtn', !first, 'Finish your first run to open this'); lock('nmBtn', save.won, first ? 'Finish your first run to open this' : 'See the dawn once to open Nightmare');
  lock('havenBtn', !first, 'Finish your first run to open the Haven');  lock('statsBtn', !first, 'Finish your first run first');
  $('modeNote').textContent = first ? 'Your first flight starts with a short lesson. You can skip it.' : save.won ? "Nightmare mode is harder, and your Root Tree's boosts can't help you." : '';
  $('havenAmber').innerHTML = first ? iconImg(ART.ICO.lock, 2) : amberTag(save.amber);
  $('havenBtn').classList.toggle('calling', !first && !save.met);
  $('havenNote').textContent = first ? 'Opens after your first run' : !save.met ? "Someone's waiting for you there" : 'Grow the Root Tree, pick your bug and catch up with everyone';
  { const owed = claimTotal(), sb = $('statsBtn'); sb.classList.toggle('notify', owed > 0 && !first); sb.dataset.n = owed ? '+' + owed : ''; sb.setAttribute('aria-label', owed ? 'Stats, ' + owed + ' amber to claim' : 'Stats'); }

  { const r = first ? null : loadRun(); $('contBox').classList.toggle('hidden', !r);
    if (r) $('contInfo').textContent = (r.daily ? 'Daily' : r.nm ? 'Nightmare' : r.endless ? 'Endless night' : 'Night') + ' as the ' + (CHARS[r.ch] || CHARS.glow).name + ', level ' + r.P.level + ' at ' + fmt(r.RT) + '. Starting a new run ends it.'; }

function playMode(mode) { // every way to play goes through here
  initAudio(); hubCloseAll();
  if (mode === 'daily') { start(true); return; }
  if (mode === 'tutorial') { start(false, true); return; }
  save.nm = mode === 'nightmare' && save.won; persist();
  start(false, !save.tut);
}
function toMenu() {
  tut = null; $('tutBox').classList.add('hidden');
  state = 'menu'; where = 'menu'; for (const id of ['over', 'pause', 'levelup', 'haven']) $(id).classList.add('hidden');
  if (hollow) hollow.active(false);
  $('start').classList.remove('hidden'); $('topbtns').classList.add('hidden'); $('dashBtn').classList.add('hidden');
  buildStart();
}
