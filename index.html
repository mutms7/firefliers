<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Firefliers</title>
<meta name="description" content="Keep the light alive until dawn. A tiny survivors game you can pick up in ten seconds, with a daily challenge to beat your friends at.">
<meta property="og:title" content="Firefliers">
<meta property="og:description" content="Keep the light alive until dawn. Everyone gets the same daily run, so come beat my score.">
<meta name="theme-color" content="#0a0c0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23081019'/%3E%3Ccircle cx='32' cy='34' r='21' fill='%23ffd76a' opacity='.28'/%3E%3Ccircle cx='32' cy='34' r='11' fill='%23ffe9a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0c0d;--panel:#0e1213;--ink:#e9e4d6;--dim:#8d9491;--mute:#5d6563;--line:#283030;--line2:#465150;--hi:#d8d2c2;
    --gold:#f2c14e;--mint:#7fd6c2;--red:#e8604c;--px:"Pixelify Sans",ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--px);font-variant-ligatures:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;
    padding:24px 16px;text-align:center;z-index:5;background:radial-gradient(ellipse at 50% 42%,rgba(9,12,13,.62) 0%,rgba(6,8,9,.88) 62%,rgba(3,4,5,.97) 100%)}
  #start{background:radial-gradient(ellipse at 50% 46%,rgba(8,11,12,.08) 0%,rgba(6,8,9,.55) 62%,rgba(3,4,5,.92) 100%)}
  .screen::before,.screen::after{content:"";flex:1 0 0}
  .screen>*{position:relative;flex:none}
  .hidden{display:none!important}
  .screen{scrollbar-width:thin;scrollbar-color:#465150 transparent}
  .flies{position:absolute!important;inset:0;overflow:hidden;pointer-events:none}
  .flies i{position:absolute;width:5px;height:5px;background:#ffe9a0;box-shadow:0 0 12px 4px #f2c14e77;opacity:0;animation:drift var(--d) ease-in-out var(--dl) infinite}
  @keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(var(--dx),var(--dy));opacity:.3}
    72%{opacity:.9}100%{transform:translate(calc(var(--dx)*1.8),calc(var(--dy)*-.6));opacity:0}}
  @media (prefers-reduced-motion:reduce){.flies i{animation:none;opacity:.5}}

  /* panels: flat dark slabs with bright corner brackets */
  .panel{--k:var(--hi);width:min(640px,100%);padding:22px 22px 20px;border:1px solid var(--line);
    background:
      linear-gradient(var(--k),var(--k)) 0 0/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 0 0/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 100% 0/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 100% 0/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 0 100%/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 0 100%/2px 18px no-repeat,
      linear-gradient(var(--k),var(--k)) 100% 100%/18px 2px no-repeat,linear-gradient(var(--k),var(--k)) 100% 100%/2px 18px no-repeat,
      linear-gradient(180deg,rgba(20,26,27,.95),rgba(10,13,14,.97));
    box-shadow:0 0 0 1px #000a,0 24px 60px -16px #000}
  .panel.wide{width:min(920px,100%)}
  .panel h2{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}

  h1{font-size:clamp(50px,12.5vw,118px);margin:0;letter-spacing:.05em;font-weight:700;line-height:1;
    background:linear-gradient(180deg,#fff6d6 0%,#f6d27a 45%,#e2a13a 75%,#b86e22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 5px 0 #140c03) drop-shadow(0 0 26px rgba(242,193,78,.3))}
  .tag{display:flex;align-items:center;gap:12px;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(11px,2.6vw,14px);color:var(--dim);margin:14px 0 2px}
  .tag::before,.tag::after{content:"";width:clamp(20px,8vw,64px);height:1px;background:var(--line2)}
  h2{font-size:clamp(26px,6vw,38px);margin:0 0 6px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 0 #000}
  #luTitle{color:var(--gold)}
  p{color:var(--dim);max-width:540px;line-height:1.45;margin:10px auto;font-size:15px}
  .sub{margin:0 0 12px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .btn{font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;padding:12px 34px;border-radius:2px;color:#1d1404;
    background:linear-gradient(180deg,#ffdc82,#e8a936);border:2px solid #1d1404;
    box-shadow:inset 0 2px 0 #fff3c8,inset 0 -4px 0 #b4741c,0 4px 0 #000c;transition:transform .08s,filter .12s}
  .btn:hover,.btn:focus-visible{filter:brightness(1.1);outline:2px solid var(--ink);outline-offset:3px}
  .btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff3c8,inset 0 -4px 0 #b4741c,0 1px 0 #000c}
  .btn.daily{color:#05201a;background:linear-gradient(180deg,#b2efe1,#5cbaa4);box-shadow:inset 0 2px 0 #eafffa,inset 0 -4px 0 #34806f,0 4px 0 #000c}
  .btn.daily:active{box-shadow:inset 0 2px 0 #eafffa,inset 0 -4px 0 #34806f,0 1px 0 #000c}
  .btn.ghost{color:var(--ink);background:rgba(13,17,18,.88);border:1px solid var(--line2);box-shadow:0 3px 0 #000b;font-weight:500}
  .btn.ghost:hover,.btn.ghost:focus-visible{border-color:var(--hi);background:#1a2122;filter:none}
  .btn.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 #000b}
  .small{font-size:13px!important;padding:8px 14px!important}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}

  /* level up: a stack of item rows */
  .cards{display:flex;flex-direction:column;gap:8px;width:100%}
  .card{--c:var(--hi);position:relative;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;padding:10px 12px 10px 10px;
    background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-left:3px solid var(--c);border-radius:2px;
    transition:background .1s,border-color .1s,transform .1s}
  .card:hover,.card:focus-visible{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.02));border-color:var(--c);outline:none;transform:translateX(4px)}
  .card .ic{width:60px;height:60px;display:grid;place-items:center;font-size:30px;line-height:1;color:var(--c);background:#070909;
    border:2px solid color-mix(in srgb,var(--c) 55%,#000);box-shadow:inset 0 0 20px -6px var(--c);text-shadow:0 0 12px var(--c)}
  .card .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .card .nm{font-size:19px;font-weight:600;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .card .lv{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:500}
  .card .new{font-size:11px;letter-spacing:.1em;color:#1d1404;background:var(--gold);padding:2px 6px 1px;font-weight:600}
  .card .ds{color:var(--dim);font-size:14px;line-height:1.35}
  .card .ev{font-size:12px;color:#c3a462}.card .ev.have{color:var(--mint)}
  .card .k{font-size:13px;color:var(--mute);border:1px solid var(--line2);width:26px;height:26px;display:grid;place-items:center}
  .card.evo{--c:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.18),rgba(242,193,78,.03));border-color:var(--gold);box-shadow:0 0 26px -10px var(--gold)}
  .card.syn{border-color:var(--gold);box-shadow:0 0 24px -8px var(--gold)}

  /* bug select */
  .chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(740px,100%);margin:22px 0 18px}
  .char{--c:var(--hi);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 11px;background:rgba(11,14,15,.88);border:1px solid var(--line);border-radius:2px;
    transition:transform .1s,border-color .1s,background .1s}
  .char .pt{width:72px;height:72px;display:block;margin-bottom:4px;border:1px solid var(--line2);background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 22%,#070909) 0%,#070909 70%)}
  .char b{font-size:16px;font-weight:600}.char span{font-size:12px;color:var(--dim);line-height:1.3}
  .char.sel{border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,rgba(11,14,15,.9)),rgba(11,14,15,.92));box-shadow:inset 0 0 0 1px var(--c),0 0 26px -10px var(--c)}
  .char.sel .pt{border-color:var(--c)}
  .char.locked{cursor:default}.char.locked .pt{background:#070909}.char.locked b{color:var(--mute)}.char.locked span{color:var(--dim)}
  .char:not(.locked):hover,.char:not(.locked):focus-visible{transform:translateY(-3px);outline:none;border-color:var(--c)}

  /* numbers */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);width:100%;margin:16px 0 4px}
  .stats div{background:#0c1011;padding:10px 6px 9px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .stats b{display:block;font-size:30px;color:var(--ink);letter-spacing:0;font-weight:600;margin-bottom:2px}
  #statTiles{grid-template-columns:repeat(5,minmax(0,1fr))}
  .best{color:var(--gold);font-size:14px;min-height:20px;margin-top:8px}
  .score{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-top:4px}
  .score b{font-size:clamp(48px,11vw,76px);font-weight:700;line-height:1;color:var(--gold);filter:drop-shadow(0 4px 0 #140c03) drop-shadow(0 0 20px rgba(242,193,78,.28))}
  .score span{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.16em}
  .scoreLine{font-size:12.5px;color:var(--dim);margin:8px auto 0;max-width:560px}
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;width:100%;margin-top:4px}
  .ach{background:#0c1011;border:1px solid var(--line);border-radius:2px;padding:8px 10px;text-align:left;opacity:.55}
  .ach.got{opacity:1;border-color:#7c6630;border-left:3px solid var(--gold)}.ach b{display:block;font-size:14px;font-weight:600}.ach.got b{color:var(--gold)}.ach span{font-size:12px;color:var(--dim)}
  .runs{width:100%;margin-top:4px;display:flex;flex-direction:column;gap:3px}
  .run{display:flex;gap:10px;justify-content:space-between;background:#0c1011;border:1px solid var(--line);border-radius:2px;padding:6px 12px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .run b{color:var(--ink);font-weight:500}.run .w{color:var(--mint)}
  .dmg{width:min(480px,100%);margin:10px auto 0;display:flex;flex-direction:column;gap:6px}
  .dmgRow{display:grid;grid-template-columns:minmax(0,10em) 1fr 4.4em 2.8em;gap:8px;align-items:center;font-size:13px;text-align:left}
  .dmgRow .dn{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dmgRow i{font-style:normal;color:var(--c);margin-right:6px}
  .dmgRow .db{height:9px;background:#ffffff0d;border:1px solid var(--line);overflow:hidden}.dmgRow .db span{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .dmgRow b{font-weight:500;text-align:right;color:var(--ink)}.dmgRow em{font-style:normal;color:var(--dim);text-align:right;font-size:12px}
  .dmgEmpty{color:var(--dim);font-size:13px}

  /* the build: little inventory slots */
  .build-h{display:flex;align-items:center;gap:12px;width:100%;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-top:20px}
  .build-h::before,.build-h::after{content:"";flex:1;height:1px;background:var(--line)}
  .build{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px;margin:10px auto 0}
  .chip{font-size:13px;padding:3px 9px 3px 3px;border-radius:2px;background:#0c1011;border:1px solid var(--line);color:var(--dim);display:inline-flex;gap:7px;align-items:center}
  .chip i{width:24px;height:24px;display:grid;place-items:center;font-style:normal;color:var(--c);background:#070909;border:1px solid color-mix(in srgb,var(--c) 50%,#000)}
  .chip b{color:var(--ink);font-weight:500}
  .chip.syn{border-color:var(--gold);box-shadow:0 0 16px -4px var(--gold);color:var(--ink);background:#2a2412}

  #toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(14,18,19,.96);border:1px solid #7c6630;border-left:3px solid var(--gold);border-radius:2px;
    padding:9px 16px;font-size:14px;color:var(--ink);pointer-events:none;transition:opacity .3s;max-width:calc(100% - 24px);text-align:center;box-shadow:0 10px 30px -10px #000}
  #tutBox{--k:var(--gold);position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:4;width:min(560px,calc(100% - 32px));padding:12px 16px;text-align:center;pointer-events:none}
  #tutStep{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  #tutText{font-size:16px;line-height:1.4;margin:5px 0 9px}#tutText b{color:var(--gold);font-weight:600}
  #tutSkip{pointer-events:auto}
  #topbtns{position:fixed;top:24px;right:10px;display:flex;gap:6px;z-index:4}
  #topbtns button{width:36px;height:36px;border-radius:2px;background:rgba(13,17,18,.85);border:1px solid var(--line2);font-size:14px;color:var(--ink)}
  #topbtns button:hover,#topbtns button:focus-visible{border-color:var(--hi);outline:none}
  #dashBtn{position:fixed;right:22px;bottom:28px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.18),rgba(242,193,78,.04));
    border:2px solid var(--gold);box-shadow:inset 0 0 0 4px rgba(10,12,13,.7),inset 0 0 0 5px rgba(242,193,78,.4);color:var(--gold);font-weight:700;font-size:15px;letter-spacing:.12em;z-index:4;touch-action:none}
  @media (max-width:640px){
    .panel{padding:16px 12px 14px}
    .card{grid-template-columns:48px minmax(0,1fr);gap:12px;padding:9px 10px 9px 8px}
    .card .ic{width:48px;height:48px;font-size:24px}.card .k{display:none}.card .nm{font-size:17px}.card .ds{font-size:13px}
    .chars{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.char .pt{width:58px;height:58px}.char span{font-size:11px}
    .stats,#statTiles{grid-template-columns:repeat(2,minmax(0,1fr))}.stats b{font-size:26px}
    .btn{padding:12px 26px;font-size:18px}
    .tag{letter-spacing:.16em}.tag::before,.tag::after{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbtns" class="hidden">
  <button id="muteBtn" aria-label="Toggle sound" title="Sound (M)">♪</button>
  <button id="pauseBtn" aria-label="Pause" title="Pause (Esc)">❚❚</button>
</div>
<button id="dashBtn" class="hidden" aria-label="Dash">DASH</button>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="stats" class="screen hidden"><div class="panel wide">
  <h2>Your stats</h2>
  <div class="stats" id="statTiles"></div>
  <div class="build-h">Achievements · <span id="achCount"></span></div>
  <div class="achs" id="achList"></div>
  <div class="build-h">Recent runs</div>
  <div class="runs" id="runList"></div>
  <p style="font-size:13px" id="statNote">Saved in this browser.</p>
  <div class="row" style="margin-top:6px"><button class="btn" id="statsBack">Back</button></div>
</div></div>
<div id="tutBox" class="panel hidden" role="status" aria-live="polite"><div id="tutStep"></div><div id="tutText"></div><button class="btn ghost small" id="tutSkip">Skip tutorial</button></div>

<div id="start" class="screen">
  <div class="flies" id="flies" aria-hidden="true"></div>
  <h1>FIREFLIERS</h1>
  <div class="tag">Keep the light alive until dawn</div>
  <div class="chars" id="chars"></div>
  <div class="row" style="margin-top:0"><button class="btn" id="playBtn">Play</button><button class="btn daily" id="dailyBtn">Daily</button></div>
  <div class="best" id="dailyInfo" style="color:var(--mint)"></div>
  <div class="row" style="margin-top:6px"><button class="btn ghost small" id="howBtn">How to play</button><button class="btn ghost small" id="statsBtn">Stats</button><button class="btn ghost small" id="nmBtn"></button></div>
  <div class="best" id="bestStart"></div>
</div>

<div id="levelup" class="screen hidden"><div class="panel">
  <h2 id="luTitle">Level up!</h2>
  <div class="sub">Choose one</div>
  <div class="cards" id="cards"></div>
  <div class="row"><button class="btn ghost small" id="rerollBtn">Reroll</button></div>
  <div id="luBuild"></div>
</div></div>

<div id="pause" class="screen hidden"><div class="panel">
  <h2>Paused</h2>
  <div class="row">
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="restartBtn">Restart</button>
    <button class="btn ghost" id="quitBtn">Menu</button>
  </div>
  <div id="pauseBuild"></div>
  <div class="build-h">Damage dealt</div>
  <div id="pauseDmg" class="dmg"></div>
</div></div>

<div id="over" class="screen hidden"><div class="panel">
  <h2 id="overTitle">The night got you</h2>
  <div class="score"><b id="stScore">0</b><span>points</span></div>
  <div class="scoreLine" id="scoreLine"></div>
  <p id="overSub"></p>
  <div class="stats">
    <div><b id="stTime">0:00</b>survived</div>
    <div><b id="stKills">0</b>squashed</div>
    <div><b id="stLevel">1</b>level</div>
    <div><b id="stFlight">0</b>fireflies</div>
  </div>
  <div class="best" id="bestOver"></div>
  <div class="best" id="unlockLine" style="color:#7dff9a"></div>
  <div id="overDmg" class="dmg hidden"></div>
  <div class="row">
    <button class="btn" id="againBtn">Play again</button>
    <button class="btn ghost hidden" id="endlessBtn">Keep going</button>
    <button class="btn daily hidden" id="shareBtn">Copy result</button>
    <button class="btn ghost" id="dmgBtn">Damage</button>
    <button class="btn ghost" id="menuBtn">Menu</button>
  </div>
</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- view ---------- */
let VW = 0, VH = 0, DPR = 1, zoom = 1, vignette = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  zoom = clamp(Math.min(VW, VH) / 680, 0.66, 1.2);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0.4px'; // also stops the pixel font joining fl and fi
  vignette = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.25, VW / 2, VH / 2, Math.hypot(VW, VH) * 0.62);
  vignette.addColorStop(0, 'rgba(4,6,7,0)'); vignette.addColorStop(1, 'rgba(3,5,6,0.72)');
}
addEventListener('resize', resize); resize();
const viewR = () => Math.hypot(VW, VH) / 2 / zoom;

const glowCache = {};
function glow(col) {
  let g = glowCache[col];
  if (!g) {
    g = document.createElement('canvas'); g.width = g.height = 64;
    const c = g.getContext('2d'), gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, col + 'cc'); gr.addColorStop(0.35, col + '55'); gr.addColorStop(1, col + '00');
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64); glowCache[col] = g;
  }
  return g;
}

/* ---------- audio ---------- */
let AC = null, master = null, muted = false, noiseBuf = null;
try { muted = localStorage.getItem('firefliers.muted') === '1'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

/* ---------- loop ---------- */
let last = performance.now();
